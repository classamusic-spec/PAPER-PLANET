<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <title>PAPER PLANET — Fold. Breathe. Come alive.</title>
    <meta
      name="description"
      content="A paper world you fold into being with your fingertips. Fold origami Kami by hand and let them live on a tiny planet you tend."
    />

    <!-- The status bar is paper too: warm cream by day, lamplit plum by night. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7ede0" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#3b3040" />
    <meta name="color-scheme" content="light dark" />

    <!-- Installed to a home screen, it should open like an app, not a page. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paper Planet" />
    <meta name="application-name" content="Paper Planet" />
    <meta name="format-detection" content="telephone=no" />

    <!-- The crane: cut-paper silhouette in safflower on a paper disc,
         with one crease shadow crossing the disc at 34°. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CclipPath id='d'%3E%3Ccircle cx='32' cy='32' r='31'/%3E%3C/clipPath%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='31' fill='%23f7ede0'/%3E%3Cg clip-path='url(%23d)'%3E%3Cpath d='M-8 60 L72 6 L72 72 L-8 72 Z' fill='%23e5d5bc'/%3E%3C/g%3E%3Cg fill='%23e4664f'%3E%3Cpath d='M31 33 7 9 16 7 35 30Z'/%3E%3Cpath d='M33 33 52 11 61 13 54 19 37 36Z'/%3E%3Cpath d='M32 30 2 30 20 48 31 40Z'/%3E%3Cpath d='M32 30 62 30 44 48 33 40Z'/%3E%3Cpath d='M28 36 36 36 33 56 29 50Z'/%3E%3C/g%3E%3C/svg%3E"
    />
    <link rel="apple-touch-icon" href="./brand/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Fraunces (opsz / wght / SOFT / WONK) and Nunito are self-hosted:
         the identity is typographic, so it must not depend on a CDN. -->
    <link rel="preload" href="./fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />

    <script>
      /* Paint the right paper before the first frame — no white flash, ever.
         Reads whatever the settings store persisted; falls back to the OS. */
      ;(function () {
        try {
          var root = document.documentElement
          var stored = localStorage.getItem('pp.theme')
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored === 'day' || stored === 'night' ? stored : dark ? 'night' : 'day'
          root.setAttribute('data-theme', theme)
          if (localStorage.getItem('pp.highInk') === 'true') root.setAttribute('data-high-ink', 'true')
        } catch (e) {
          /* private mode: the day theme in the markup is already correct */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font: 16px/1.5 system-ui; padding: 24px">
        PAPER PLANET needs JavaScript to fold. Please enable it and reload.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
